name: Setup
description: Install pnpm, Node (from .nvmrc) and dependencies from the lockfile, with the pnpm store cached.

runs:
  using: composite
  steps:
    # Before setup-node, so its pnpm cache has a store to point at.
    # The pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # Also registers the ESLint problem matchers, so lint errors show inline on the PR.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
